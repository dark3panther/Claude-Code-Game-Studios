name: Classroom Creatures – macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - 'classroom-creatures/**'
      - '.github/workflows/classroom-creatures-mac.yml'

jobs:
  mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: classroom-creatures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: classroom-creatures/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build universal .dmg and .zip (ad-hoc signed)
        run: npm run app:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Classroom-Creatures-mac
          path: |
            classroom-creatures/release/*.dmg
            classroom-creatures/release/*.zip
          if-no-files-found: error
